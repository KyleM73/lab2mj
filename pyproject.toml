[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lab2mj"
version = "0.1.0"
description = "Isaac Lab -> MuJoCo sim2sim converter, runtime, and validation harness for manager-based RL tasks"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kyle Morgenstein" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    # Upper bound = the MuJoCo line contact_lab trains/validates against; newer releases
    # drop mjData.qM (used by lab2mj.stiction) and change USD->MJCF joint compilation.
    "mujoco>=3.1.3,<3.8",
    "scipy",
    "pyyaml",
]

[project.optional-dependencies]
# USD -> MJCF conversion (lab2mj-convert, usd2mjcf). Pure-numpy runtime does not need it.
usd = ["usd-core>=24.0"]
# TorchScript policies / actuator nets (lab2mj-play, PreTrainedPolicyAction, LSTM/MLP nets).
torch = ["torch>=2.0"]
# Validation plots and ghost-compare rendering.
plot = ["matplotlib", "pillow"]
all = ["lab2mj[usd,torch,plot]"]

[project.scripts]
lab2mj-convert = "lab2mj.convert:main"
lab2mj-play = "lab2mj.play:main"
lab2mj-validate = "lab2mj.validate:main"
lab2mj-dump-env-cfg = "lab2mj.dump_env_cfg:main"

[dependency-groups]
# Full offline test suite (skips whatever assets under data/ are absent).
dev = [
    "lab2mj[all]",
    "pytest",
    "ruff",
    # Only imported by the Isaac-side dumper scripts / dump_env_cfg; here so ty resolves them.
    "gymnasium",
    "omegaconf",
]
# Isaac Lab's pure-python config layer (no Isaac Sim), for lab2mj-dump-env-cfg under
# isaac_shims and the tests that exercise it (test_cfg_dump_local, test_heightscan).
isaac = [
    "isaaclab",
    "isaaclab-tasks",
    "isaaclab-assets",
]

[tool.uv]
# isaaclab pins flatdict==4.0.1, whose sdist no longer builds (pkg_resources); same override as contact_lab.
override-dependencies = ["flatdict==4.1.0"]

[tool.uv.sources]
isaaclab = { git = "https://github.com/isaac-sim/IsaacLab.git", subdirectory = "source/isaaclab", tag = "v2.3.0" }
isaaclab-tasks = { git = "https://github.com/isaac-sim/IsaacLab.git", subdirectory = "source/isaaclab_tasks", tag = "v2.3.0" }
isaaclab-assets = { git = "https://github.com/isaac-sim/IsaacLab.git", subdirectory = "source/isaaclab_assets", tag = "v2.3.0" }

[tool.setuptools.packages.find]
include = ["lab2mj*"]
exclude = ["lab2mj.tests*"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["logs/*", "data/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E402: the Isaac-side dumper scripts must launch the Kit app before importing isaaclab.
ignore = ["E402", "E203"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-third-party = ["isaacsim", "omni", "pxr", "warp", "carb", "isaaclab", "isaaclab_tasks", "contact_lab"]
known-first-party = ["lab2mj"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["lab2mj/tests"]
norecursedirs = ["scripts", "logs", "data"]

# Treat as Any: C extensions without stubs and the Omniverse runtime that only exists on
# the GPU box. isaaclab itself resolves via the `isaac` group + scripts/fix_isaaclab_stubs.py.
[tool.ty.analysis]
replace-imports-with-any = [
    "mujoco", "mujoco.**",
    "pxr", "pxr.**",
    "omni", "omni.**",
    "carb", "carb.**",
    "contact_lab", "contact_lab.**",
]

[tool.ty.rules]
invalid-overload = "ignore"
