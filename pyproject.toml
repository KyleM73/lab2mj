[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lab2mj"
version = "0.1.0"
description = "Isaac Lab -> MuJoCo sim2sim converter, runtime, and validation harness for manager-based RL tasks"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kyle Morgenstein" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "mujoco>=3.1.3,<3.8",  # >=3.8 drops mjData.qM and breaks enum/int comparisons
    "scipy",
    "pyyaml",
]

[project.optional-dependencies]
usd = ["usd-core>=24.0"]      # conversion
torch = ["torch>=2.0"]        # policies, actuator nets
plot = ["matplotlib", "pillow"]
all = ["lab2mj[usd,torch,plot]"]

[project.scripts]
lab2mj-convert = "lab2mj.convert:main"
lab2mj-play = "lab2mj.play:main"
lab2mj-validate = "lab2mj.validate:main"
lab2mj-dump-env-cfg = "lab2mj.dump_env_cfg:main"

[dependency-groups]
dev = ["lab2mj[all]", "pytest", "ruff", "gymnasium", "omegaconf"]
# Isaac Lab's pure-python config layer (no Isaac Sim) for dump_env_cfg and its tests.
isaac = [
    "isaaclab",
    "isaaclab-tasks",
    "isaaclab-assets",
]

[tool.uv]
override-dependencies = ["flatdict==4.1.0"]  # isaaclab's 4.0.1 pin no longer builds

[tool.uv.sources]
isaaclab = { git = "https://github.com/isaac-sim/IsaacLab.git", subdirectory = "source/isaaclab", tag = "v2.3.0" }
isaaclab-tasks = { git = "https://github.com/isaac-sim/IsaacLab.git", subdirectory = "source/isaaclab_tasks", tag = "v2.3.0" }
isaaclab-assets = { git = "https://github.com/isaac-sim/IsaacLab.git", subdirectory = "source/isaaclab_assets", tag = "v2.3.0" }

[tool.setuptools.packages.find]
include = ["lab2mj*"]
exclude = ["lab2mj.tests*"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["logs/*", "data/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402", "E203"]  # E402: Isaac scripts import after the Kit app launches

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-third-party = ["isaacsim", "omni", "pxr", "warp", "carb", "isaaclab", "isaaclab_tasks", "contact_lab"]
known-first-party = ["lab2mj"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["lab2mj/tests"]
norecursedirs = ["scripts", "logs", "data"]

# Stub-less C extensions and the GPU-box-only Omniverse runtime.
[tool.ty.analysis]
replace-imports-with-any = [
    "mujoco", "mujoco.**",
    "pxr", "pxr.**",
    "omni", "omni.**",
    "carb", "carb.**",
    "contact_lab", "contact_lab.**",
]

[tool.ty.rules]
invalid-overload = "ignore"
