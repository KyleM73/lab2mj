# Rough-task deltas relative to the real g1_flat_env.yaml dump (the only
# parser-read differences of IsaacLab's Isaac-Velocity-Rough-G1-v0 vs the flat
# task): generator terrain, the height scanner + height_scan obs term, and the
# rough cfg's zeroed lin_vel_y range. lab2mj/tests/shared.py::g1_rough_env_dict
# deep-merges this file onto g1_flat_env.yaml.
scene:
  terrain:
    terrain_type: generator
    terrain_generator:
      class_type: isaaclab.terrains.terrain_generator:TerrainGenerator
      seed: null
      curriculum: true
      size:
      - 8.0
      - 8.0
      border_width: 20.0
      border_height: 1.0
      num_rows: 10
      num_cols: 20
      color_scheme: none
      horizontal_scale: 0.1
      vertical_scale: 0.005
      slope_threshold: 0.75
      sub_terrains:
        pyramid_stairs:
          function: isaaclab.terrains.trimesh.mesh_terrains:pyramid_stairs_terrain
          proportion: 0.2
          size:
          - 8.0
          - 8.0
          flat_patch_sampling: null
          border_width: 1.0
          step_height_range:
          - 0.05
          - 0.23
          step_width: 0.3
          platform_width: 3.0
          holes: false
        pyramid_stairs_inv:
          function: isaaclab.terrains.trimesh.mesh_terrains:inverted_pyramid_stairs_terrain
          proportion: 0.2
          size:
          - 8.0
          - 8.0
          flat_patch_sampling: null
          border_width: 1.0
          step_height_range:
          - 0.05
          - 0.23
          step_width: 0.3
          platform_width: 3.0
          holes: false
        boxes:
          function: isaaclab.terrains.trimesh.mesh_terrains:random_grid_terrain
          proportion: 0.2
          size:
          - 8.0
          - 8.0
          flat_patch_sampling: null
          grid_width: 0.45
          grid_height_range:
          - 0.05
          - 0.2
          platform_width: 2.0
          holes: false
        random_rough:
          function: isaaclab.terrains.height_field.hf_terrains:random_uniform_terrain
          proportion: 0.2
          size:
          - 8.0
          - 8.0
          flat_patch_sampling: null
          border_width: 0.25
          horizontal_scale: 0.1
          vertical_scale: 0.005
          slope_threshold: 0.75
          noise_range:
          - 0.02
          - 0.1
          noise_step: 0.02
          downsampled_scale: null
        hf_pyramid_slope:
          function: isaaclab.terrains.height_field.hf_terrains:pyramid_sloped_terrain
          proportion: 0.1
          size:
          - 8.0
          - 8.0
          flat_patch_sampling: null
          border_width: 0.25
          horizontal_scale: 0.1
          vertical_scale: 0.005
          slope_threshold: 0.75
          slope_range:
          - 0.0
          - 0.4
          platform_width: 2.0
          inverted: false
        hf_pyramid_slope_inv:
          function: isaaclab.terrains.height_field.hf_terrains:pyramid_sloped_terrain
          proportion: 0.1
          size:
          - 8.0
          - 8.0
          flat_patch_sampling: null
          border_width: 0.25
          horizontal_scale: 0.1
          vertical_scale: 0.005
          slope_threshold: 0.75
          slope_range:
          - 0.0
          - 0.4
          platform_width: 2.0
          inverted: true
      difficulty_range:
      - 0.0
      - 1.0
      use_cache: false
      cache_dir: /tmp/isaaclab/terrains
  height_scanner:
    class_type: isaaclab.sensors.ray_caster.ray_caster:RayCaster
    prim_path: /World/envs/env_.*/Robot/torso_link
    update_period: 0.02
    history_length: 0
    debug_vis: false
    mesh_prim_paths:
    - /World/ground
    offset:
      pos:
      - 0.0
      - 0.0
      - 20.0
      rot:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
    attach_yaw_only: null
    ray_alignment: yaw
    pattern_cfg:
      func: isaaclab.sensors.ray_caster.patterns.patterns:grid_pattern
      resolution: 0.1
      size:
      - 1.6
      - 1.0
      direction:
      - 0.0
      - 0.0
      - -1.0
      ordering: xy
    max_distance: 1000000.0
    drift_range:
    - 0.0
    - 0.0
    ray_cast_drift_range:
      x:
      - 0.0
      - 0.0
      y:
      - 0.0
      - 0.0
      z:
      - 0.0
      - 0.0
    visualizer_cfg:
      prim_path: /Visuals/RayCaster
observations:
  policy:
    height_scan:
      func: isaaclab.envs.mdp.observations:height_scan
      params:
        sensor_cfg:
          name: height_scanner
          joint_names: null
          joint_ids: null
          fixed_tendon_names: null
          fixed_tendon_ids: null
          body_names: null
          body_ids: null
          object_collection_names: null
          object_collection_ids: null
          preserve_order: false
      modifiers: null
      noise:
        func: isaaclab.utils.noise.noise_model:uniform_noise
        operation: add
        n_min: -0.1
        n_max: 0.1
      clip:
      - -1.0
      - 1.0
      scale: null
      history_length: 0
      flatten_history_dim: true
commands:
  base_velocity:
    ranges:
      lin_vel_y:
      - -0.0
      - 0.0
