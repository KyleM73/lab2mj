    - 8.0
    debug_vis: true
    asset_name: robot
    simple_heading: false
    ranges:
      pos_x: !!python/tuple
      - -3.0
      - 3.0
      pos_y: !!python/tuple
      - -3.0
      - 3.0
      heading: !!python/tuple
      - -3.141592653589793
      - 3.141592653589793
    goal_pose_visualizer_cfg:
      prim_path: /Visuals/Command/pose_goal
